# Once a day, feature the blog post with the biggest jump in views.
# See scripts/feature_trending.py for the scoring.
#
# Setup (once, in repo Settings > Secrets and variables > Actions):
#   GA4_PROPERTY_ID           numeric GA4 property id (Admin > Property details),
#                             not the G-Z8GY6PR3WM measurement id
#   GA4_SERVICE_ACCOUNT_JSON  key file of a Google Cloud service account that has
#                             Viewer access on that GA4 property
# Until both exist the job runs, logs that it skipped, and changes nothing.
name: Trending featured article

on:
  schedule:
    - cron: '17 11 * * *'   # 6:17am Central (5:17am in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trending-featured
  cancel-in-progress: false

jobs:
  feature:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pick the featured article
        run: |
          if [ -z "$GA4_PROPERTY_ID" ] || [ -z "$GA4_KEY" ]; then
            echo "GA4 secrets are not set yet; nothing to do."
            exit 0
          fi
          pip install --quiet google-analytics-data
          printf '%s' "$GA4_KEY" > "$RUNNER_TEMP/ga4-key.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga4-key.json" python3 scripts/feature_trending.py

      - name: Commit if it changed
        run: |
          git diff --quiet blog/index.html && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898541+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Blog: feature the trending article'
          git push
