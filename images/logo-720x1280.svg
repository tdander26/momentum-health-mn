  <text class="sans" x="360" y="1124" text-anchor="middle"
        font-size="20" font-weight="500" letter-spacing="3.4" fill="#C9A84C">ELK RIVER, MINNESOTA</text>
  <text class="serif" x="360" y="1172" text-anchor="middle"
